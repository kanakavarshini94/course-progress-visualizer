spring.application.name=course-progress-visualizer
server.port=8080

# H2 file database: your data remains saved after restarting the application.
spring.datasource.url=jdbc:h2:file:./data/courseprogress;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false
server.servlet.session.timeout=30m